<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>活动列表</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="brand-mark">✦</div>
      <span class="topbar-meta" id="space-key-label"></span>
      <div class="topbar-spacer"></div>
      <div class="topbar-actions">
        <button class="topbar-action primary" id="btn-share">分享空间</button>
        <button class="topbar-action" id="btn-logout">退出</button>
      </div>
    </div>
    <div class="content" id="main-content">
      <div id="loading-state" class="loading">
        <div class="spinner"></div>
        <span>加载中…</span>
      </div>
      <div id="list-container" style="display:none"></div>
    </div>
  </div>

  <a class="fab" href="/new.html" title="发布活动">+</a>

  <div class="share-modal-overlay" id="shareModal">
    <div class="share-modal-box">
      <div class="share-modal-title">分享空间链接</div>
      <input class="share-modal-input" id="shareModalInput" type="text" readonly>
      <div class="share-modal-hint">长按输入框 → 全选 → 复制，或点击下方复制按钮</div>
      <div class="share-modal-btns">
        <button class="share-modal-copy" id="shareModalCopyBtn">复制链接</button>
        <button class="share-modal-close" id="shareModalCloseBtn">关闭</button>
      </div>
    </div>
  </div>

  <script src="/lib/api.js"></script>
  <script src="/lib/activity-types.js"></script>
  <script>
    (async () => {
      api.requireAuth();

      const spaceKey = api.getSpaceKey();
      document.getElementById('space-key-label').textContent = spaceKey || '我的空间';

      document.getElementById('btn-logout').addEventListener('click', () => {
        api.clearAuth();
        window.location.href = '/index.html';
      });

      function _getSpaceShareUrl() {
        return window.location.origin + '/index.html?key=' + encodeURIComponent(spaceKey);
      }

      function _showShareModal(url) {
        const input = document.getElementById('shareModalInput');
        input.value = url;
        document.getElementById('shareModal').classList.add('visible');
        setTimeout(() => { input.focus(); input.setSelectionRange(0, url.length); }, 120);
      }

      document.getElementById('shareModalCloseBtn').addEventListener('click', () => {
        document.getElementById('shareModal').classList.remove('visible');
      });

      document.getElementById('shareModalCopyBtn').addEventListener('click', () => {
        const url = document.getElementById('shareModalInput').value;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(() => {
            document.getElementById('shareModal').classList.remove('visible');
            const btn = document.getElementById('btn-share');
            const orig = btn.textContent;
            btn.textContent = '已复制！';
            setTimeout(() => { btn.textContent = orig; }, 2000);
          }).catch(() => {});
        }
      });

      document.getElementById('btn-share').addEventListener('click', () => {
        const url = _getSpaceShareUrl();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(() => {
            const btn = document.getElementById('btn-share');
            const orig = btn.textContent;
            btn.textContent = '已复制！';
            setTimeout(() => { btn.textContent = orig; }, 2000);
          }).catch(() => { _showShareModal(url); });
        } else {
          const el = document.createElement('input');
          el.value = url;
          el.setAttribute('readonly', '');
          el.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
          document.body.appendChild(el);
          el.focus(); el.select(); el.setSelectionRange(0, url.length);
          const ok = document.execCommand('copy');
          document.body.removeChild(el);
          if (ok) {
            const btn = document.getElementById('btn-share');
            const orig = btn.textContent;
            btn.textContent = '已复制！';
            setTimeout(() => { btn.textContent = orig; }, 2000);
          } else {
            _showShareModal(url);
          }
        }
      });

      let allSessions = [];
      let activeTypeFilter = 'all';

      function escHtml(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function buildCard(session, expired) {
        const typeInfo = getActivityType(session.type || 'other');
        const date = api.formatDate(session.date);
        const time = api.formatTime(session.start_time, session.end_time);
        const venue = escHtml(session.venue || '');
        const max = session.max_players || 0;
        const count = session.signupCount != null ? session.signupCount : 0;
        const isFull = max > 0 && count >= max;
        const fee = session.fee != null && session.fee > 0 ? `¥${session.fee}/人` : '';

        let statusBadge = '';
        if (expired) statusBadge = '<span class="card-status-badge expired">已结束</span>';
        else if (isFull) statusBadge = '<span class="card-status-badge full">已满员</span>';

        const countText = max > 0 ? `已报 ${count}/${max} 人` : `已报 ${count} 人`;
        const countClass = 'card-count' + (isFull ? ' full' : '');

        return `
          <a class="card${expired ? ' expired' : ''}" href="/session.html?id=${encodeURIComponent(session.id)}">
            <div class="card-type-row">
              <span class="card-type-badge">${typeInfo.icon} ${escHtml(typeInfo.name)}</span>
              ${statusBadge}
            </div>
            <div class="card-date">${date}</div>
            <div class="card-time-venue">${time}${venue ? ' · ' + venue : ''}</div>
            <div class="card-meta">
              ${fee ? `<span class="card-fee">${fee}</span>` : ''}
              <span class="${countClass}">${countText}</span>
            </div>
          </a>`;
      }

      function renderTypeChips(sessions) {
        const usedTypes = new Set(sessions.map(s => s.type || 'other'));
        const chips = document.getElementById('type-chips-container');
        if (!chips) return;

        let html = '<button class="type-chip active" data-type="all">全部</button>';
        ACTIVITY_TYPES.forEach(t => {
          if (usedTypes.has(t.key)) {
            html += `<button class="type-chip" data-type="${t.key}">${t.icon} ${t.name}</button>`;
          }
        });
        chips.innerHTML = html;

        chips.querySelectorAll('.type-chip').forEach(btn => {
          btn.addEventListener('click', () => {
            chips.querySelectorAll('.type-chip').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activeTypeFilter = btn.dataset.type;
            renderList();
          });
        });
      }

      function renderList() {
        const filtered = activeTypeFilter === 'all'
          ? allSessions
          : allSessions.filter(s => (s.type || 'other') === activeTypeFilter);

        const container = document.getElementById('list-container');
        const active = filtered.filter(s => !api.isExpired(s));
        const expired = filtered.filter(s => api.isExpired(s));

        active.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
        expired.sort((a, b) => a.date > b.date ? -1 : a.date < b.date ? 1 : 0);

        const listEl = document.getElementById('cards-container');
        if (!listEl) return;

        if (!filtered.length) {
          listEl.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">📋</div>
              <div class="empty-state-text">暂无活动<br>点击右下角 + 发布</div>
            </div>`;
          return;
        }

        let html = '';
        if (active.length) {
          html += '<div class="section-title">即将开始</div>';
          active.forEach(s => { html += buildCard(s, false); });
        }
        if (expired.length) {
          html += '<div class="section-title">已结束</div>';
          expired.forEach(s => { html += buildCard(s, true); });
        }
        listEl.innerHTML = html;
      }

      function renderSessions(sessions) {
        document.getElementById('loading-state').style.display = 'none';
        const container = document.getElementById('list-container');
        container.style.display = 'block';

        if (!sessions.length) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">📋</div>
              <div class="empty-state-text">暂无活动<br>点击右下角 + 发布</div>
            </div>`;
          return;
        }

        container.innerHTML = `
          <div class="type-chips" id="type-chips-container"></div>
          <div id="cards-container"></div>`;

        renderTypeChips(sessions);
        renderList();
      }

      function showError(msg) {
        document.getElementById('loading-state').style.display = 'none';
        const container = document.getElementById('list-container');
        container.style.display = 'block';
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">⚠️</div>
            <div class="empty-state-text">${escHtml(msg)}</div>
          </div>`;
      }

      try {
        const sessions = (await api.getSessions()).filter(s => !s.private);
        await Promise.all(sessions.map(async s => {
          try {
            const sups = await api.getSignups(s.id);
            s.signupCount = sups.length;
          } catch { s.signupCount = 0; }
        }));
        allSessions = sessions;
        renderSessions(sessions);
      } catch (e) {
        showError(e.message || '加载失败，请刷新重试');
      }
    })();
  </script>
</body>
</html>
