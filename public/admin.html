<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/yueju/">
  <title>管理后台</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f5f5f5; color: #212121; font-size: 15px; }

    .topbar { background: #222222; color: #fff; padding: 0 20px; height: 56px; display: flex; align-items: center; gap: 12px; }
    .topbar-icon { font-size: 20px; }
    .topbar-title { font-size: 17px; font-weight: 600; }
    .topbar-sub { font-size: 13px; opacity: 0.55; }
    .logout-btn { margin-left: auto; background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.3); padding: 6px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; font-family: inherit; }
    .logout-btn:hover { background: rgba(255,255,255,0.22); }

    .container { max-width: 960px; margin: 0 auto; padding: 28px 16px; }

    .login-card { background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); padding: 36px 32px; max-width: 400px; margin: 60px auto; }
    .login-card h2 { font-size: 19px; font-weight: 700; margin-bottom: 24px; color: #222; }
    .login-card input { width: 100%; border: 1px solid #e0e0e0; border-radius: 8px; padding: 11px 14px; font-size: 15px; outline: none; margin-bottom: 12px; font-family: inherit; transition: border-color 0.15s; }
    .login-card input:focus { border-color: #222; }
    .login-card button { width: 100%; height: 48px; background: #222; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .login-card button:hover { background: #333; }
    .login-card button:disabled { opacity: 0.5; cursor: not-allowed; }
    .err { color: #c13515; font-size: 13px; margin-top: 8px; }

    .panel { display: flex; gap: 20px; align-items: flex-start; }

    .sidebar { width: 220px; flex-shrink: 0; }
    .sidebar-title { font-size: 11px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 8px; padding: 0 4px; }
    .space-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; color: #333; font-size: 14px; margin-bottom: 4px; transition: background 0.12s; word-break: break-all; display: flex; align-items: center; justify-content: space-between; }
    .space-item:hover { background: #ECEFF1; }
    .space-item.active { background: #222; color: #fff; }
    .space-item-arrow { font-size: 11px; color: #ccc; flex-shrink: 0; }
    .space-created { font-size: 11px; opacity: 0.6; margin-top: 2px; }

    .main { flex: 1; min-width: 0; }
    .empty-state { text-align: center; padding: 80px 0; color: #bbb; font-size: 15px; }

    @media (max-width: 640px) {
      .panel { flex-direction: column; }
      .sidebar { width: 100%; }
    }
  </style>
</head>
<body>

<div class="topbar">
  <span class="topbar-icon">🛡️</span>
  <span class="topbar-title">管理后台</span>
  <span class="topbar-sub">约局</span>
  <button class="logout-btn" id="logoutBtn" style="display:none">退出登录</button>
</div>

<div class="container" id="app">
  <div class="login-card" id="loginSection">
    <h2>管理员登录</h2>
    <input type="password" id="pwdInput" placeholder="输入管理密码" autocomplete="current-password">
    <button id="loginBtn">进入后台</button>
    <div class="err" id="loginErr"></div>
  </div>

  <div class="panel" id="mainSection" style="display:none">
    <div class="sidebar">
      <div class="sidebar-title">空间列表</div>
      <div id="spaceList"></div>
    </div>
    <div class="main" id="sessionMain">
      <div class="empty-state">← 点击左侧空间查看详情</div>
    </div>
  </div>
</div>

<script>
  let ADMIN_PWD = '';

  function fmtCreated(s) {
    if (!s) return '';
    const d = new Date(s);
    return `${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }

  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function post(path, body) {
    const res = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || '请求失败');
    return data;
  }

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const pwd = document.getElementById('pwdInput').value;
    const err = document.getElementById('loginErr');
    const btn = document.getElementById('loginBtn');
    err.textContent = '';
    if (!pwd) { err.textContent = '请输入管理密码'; return; }
    btn.disabled = true; btn.textContent = '验证中...';
    try {
      const data = await post('/api/custom/admin/spaces', { admin_password: pwd });
      ADMIN_PWD = pwd;
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('mainSection').style.display = 'flex';
      document.getElementById('logoutBtn').style.display = 'inline-block';
      renderSpaces(data.spaces || []);
    } catch (e) {
      err.textContent = e.message === 'Invalid admin_password' ? '密码错误' : e.message;
      btn.disabled = false; btn.textContent = '进入后台';
    }
  });

  document.getElementById('pwdInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('loginBtn').click();
  });

  document.getElementById('logoutBtn').addEventListener('click', () => {
    ADMIN_PWD = '';
    document.getElementById('loginSection').style.display = 'block';
    document.getElementById('mainSection').style.display = 'none';
    document.getElementById('logoutBtn').style.display = 'none';
    document.getElementById('pwdInput').value = '';
  });

  function renderSpaces(spaces) {
    const list = document.getElementById('spaceList');
    if (!spaces.length) {
      list.innerHTML = '<div style="color:#bbb;font-size:13px;padding:8px 4px">暂无空间</div>';
      return;
    }
    list.innerHTML = spaces.map(sp => `
      <div class="space-item" data-id="${esc(sp.id)}" data-key="${esc(sp.username)}" onclick="openSpace(this)">
        <div>
          <div>${esc(sp.username)}</div>
          <div class="space-created">${fmtCreated(sp.created)}</div>
        </div>
        <span class="space-item-arrow">▶</span>
      </div>`).join('');
  }

  function openSpace(el) {
    const spaceKey = el.dataset.key;
    sessionStorage.setItem('admin_cred', JSON.stringify({ pwd: ADMIN_PWD, spaceKey }));
    window.location.href = 'admin-space.html';
  }
</script>
</body>
</html>
